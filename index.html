<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhurandhar (2025) - Stream</title>
    <style>
        :root {
            --bg-color: #0f172a; /* Slate 900 */
            --text-color: #e2e8f0; /* Slate 200 */
            --accent-color: #38bdf8; /* Sky 400 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #1e293b;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .info {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #1e293b;
            color: #cbd5e1;
            font-size: 0.75rem;
            margin-top: 10px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #334155;
        }

        .btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
            font-weight: 600;
        }
        
        /* New Styles for Landing Page */
        .hidden {
            display: none !important;
        }

        .landing-page {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            text-align: center;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .movie-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: var(--accent-color);
        }

        .movie-card h2 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-color);
        }

        .movie-card .meta {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn:hover {
            background: #334155;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- LANDING PAGE -->
    <div id="landingPage" class="landing-page">
        <h1>NANA STREAM</h1>
        <p style="color: #94a3b8;">Select a movie to start watching</p>
        
        <div class="movies-grid" id="moviesGrid">
            <!-- Cards injected by JS -->
        </div>
    </div>

    <!-- PLAYER PAGE -->
    <div id="playerPage" class="container hidden">
        <button class="back-btn" onclick="goHome()">← Back to Home</button>
        
        <h1 id="movieTitle" style="margin-top: 40px;">Loading...</h1>
        
        <div class="video-container">
            <iframe 
                id="videoPlayer"
                src="" 
                scrolling="no" 
                allowfullscreen="true"
                sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"
            ></iframe>
        </div>

        <div class="controls" id="sourceControls">
            <!-- Source buttons will be injected here -->
        </div>

        <div class="info" id="movieInfo">
            <!-- Info will be injected here -->
        </div>
    </div>

    <script>
        const movies = {
            'dhurandhar-2025': {
                id: 'dhurandhar-2025',
                title: "Dhurandhar",
                year: "2025",
                lang: "Hindi",
                info: "High Definition • Hindi • 2025",
                badge: "Ad-Lite Mode Active",
                defaultSource: 'gdrive',
                sources: [
                    {
                        id: 'gdrive',
                        label: 'Server 1 (Google Drive)',
                        url: 'https://drive.google.com/file/d/1DL0zldxDt05Gv5reMyLq67VLlRVTqLHB/preview',
                        warning: 'Note: Google Drive may have playback limits.'
                    },
                    {
                        id: 'minochinos',
                        label: 'Server 2 (Backup)',
                        url: 'https://minochinos.com/embed/958rcgrj9b7y',
                        warning: null
                    }
                ]
            },
            'msvpg-2026': {
                id: 'msvpg-2026',
                title: "Mana Shankara Vara Prasad Garu",
                year: "2026",
                lang: "Telugu",
                info: "High Definition • Telugu • 2026",
                badge: "Ad-Lite Mode Active",
                defaultSource: 'gdrive',
                sources: [
                    {
                        id: 'gdrive',
                        label: 'Server 1 (Google Drive)',
                        url: 'https://drive.google.com/file/d/1qytPJOLXXZzbV0wrYcJnfSg_E-RsuSj7/preview',
                        warning: 'Note: Google Drive may have playback limits.'
                    }
                ]
            }
        };

        const landingPage = document.getElementById('landingPage');
        const playerPage = document.getElementById('playerPage');
        const moviesGrid = document.getElementById('moviesGrid');
        
        const titleEl = document.getElementById('movieTitle');
        const player = document.getElementById('videoPlayer');
        const controlsEl = document.getElementById('sourceControls');
        const infoEl = document.getElementById('movieInfo');

        function init() {
            // Populate Grid
            for (const [key, movie] of Object.entries(movies)) {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => loadMovie(key);
                card.innerHTML = `
                    <h2>${movie.title}</h2>
                    <div class="meta">${movie.year} • ${movie.lang}</div>
                `;
                moviesGrid.appendChild(card);
            }
        }

        function loadMovie(movieId) {
            const movie = movies[movieId];
            if (!movie) return;

            // Switch Views
            landingPage.classList.add('hidden');
            playerPage.classList.remove('hidden');

            // Update Player Content
            titleEl.textContent = `${movie.title} (${movie.year})`;
            
            infoEl.innerHTML = `
                <p>${movie.info}</p>
                <div class="badge">${movie.badge}</div>
                <div id="drive-warning" style="display:none; color: #fbbf24; font-size: 0.8rem; margin-top: 5px;"></div>
            `;

            // Setup Controls
            controlsEl.innerHTML = '';
            movie.sources.forEach(source => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = source.label;
                btn.onclick = () => setSource(movieId, source.id);
                btn.id = `btn-${source.id}`;
                controlsEl.appendChild(btn);
            });

            // Load default source
            setSource(movieId, movie.defaultSource);
        }

        function setSource(movieId, sourceId) {
            const movie = movies[movieId];
            const source = movie.sources.find(s => s.id === sourceId);
            if (!source) return;

            player.src = source.url;

            // Update Buttons
            const buttons = controlsEl.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${sourceId}`);
            if (activeBtn) activeBtn.classList.add('active');

            // Warning
            const warningEl = document.getElementById('drive-warning');
            if (source.warning) {
                warningEl.textContent = source.warning;
                warningEl.style.display = 'block';
            } else {
                warningEl.style.display = 'none';
            }
        }

        function goHome() {
            player.src = ""; // Stop video
            playerPage.classList.add('hidden');
            landingPage.classList.remove('hidden');
        }

        init();
    </script>
