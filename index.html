<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhurandhar (2025) - Stream</title>
    <style>
        :root {
            --bg-color: #0f172a; /* Slate 900 */
            --text-color: #e2e8f0; /* Slate 200 */
            --accent-color: #38bdf8; /* Sky 400 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #1e293b;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .info {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #1e293b;
            color: #cbd5e1;
            font-size: 0.75rem;
            margin-top: 10px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #334155;
        }

        .btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .movie-selector {
            margin-bottom: 20px;
        }
        
        select {
            background-color: #1e293b;
            color: var(--text-color);
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="movie-selector">
            <select id="movieSelect" onchange="loadMovie(this.value)">
                <!-- Options will be populated by JS -->
            </select>
        </div>

        <h1 id="movieTitle">Loading...</h1>
        
        <div class="video-container">
            <iframe 
                id="videoPlayer"
                src="" 
                scrolling="no" 
                allowfullscreen="true"
                sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"
            ></iframe>
        </div>

        <div class="controls" id="sourceControls">
            <!-- Source buttons will be injected here -->
        </div>

        <div class="info" id="movieInfo">
            <!-- Info will be injected here -->
        </div>
    </div>

    <script>
        const movies = {
            'dhurandhar-2025': {
                title: "Dhurandhar (2025)",
                info: "High Definition • Hindi • 2025",
                badge: "Ad-Lite Mode Active",
                defaultSource: 'gdrive',
                sources: [
                    {
                        id: 'gdrive',
                        label: 'Server 1 (Google Drive)',
                        url: 'https://drive.google.com/file/d/1DL0zldxDt05Gv5reMyLq67VLlRVTqLHB/preview',
                        warning: 'Note: Google Drive may have playback limits.'
                    },
                    {
                        id: 'minochinos',
                        label: 'Server 2 (Backup)',
                        url: 'https://minochinos.com/embed/958rcgrj9b7y',
                        warning: null
                    }
                ]
            },
            'msvpg-2026': {
                title: "Mana Shankara Vara Prasad Garu (2026)",
                info: "High Definition • Telugu • 2026",
                badge: "Ad-Lite Mode Active",
                defaultSource: 'gdrive',
                sources: [
                    {
                        id: 'gdrive',
                        label: 'Server 1 (Google Drive)',
                        url: 'https://drive.google.com/file/d/1qytPJOLXXZzbV0wrYcJnfSg_E-RsuSj7/preview',
                        warning: 'Note: Google Drive may have playback limits.'
                    }
                ]
            }
        };

        const movieSelect = document.getElementById('movieSelect');
        const titleEl = document.getElementById('movieTitle');
        const player = document.getElementById('videoPlayer');
        const controlsEl = document.getElementById('sourceControls');
        const infoEl = document.getElementById('movieInfo');

        // Initialize
        function init() {
            // Populate dropdown
            for (const [key, movie] of Object.entries(movies)) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = movie.title;
                movieSelect.appendChild(option);
            }
            
            // Load default (first movie) or restored state could go here
            loadMovie('dhurandhar-2025');
        }

        function loadMovie(movieId) {
            const movie = movies[movieId];
            if (!movie) return;

            // Update Title
            titleEl.textContent = movie.title;

            // Update Info
            infoEl.innerHTML = `
                <p>${movie.info}</p>
                <div class="badge">${movie.badge}</div>
                <div id="drive-warning" style="display:none; color: #fbbf24; font-size: 0.8rem; margin-top: 5px;"></div>
            `;

            // Setup Controls
            controlsEl.innerHTML = '';
            movie.sources.forEach(source => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = source.label;
                btn.onclick = () => setSource(movieId, source.id);
                btn.id = `btn-${source.id}`;
                controlsEl.appendChild(btn);
            });

            // Load default source
            setSource(movieId, movie.defaultSource);
        }

        function setSource(movieId, sourceId) {
            const movie = movies[movieId];
            const source = movie.sources.find(s => s.id === sourceId);
            if (!source) return;

            // Update Player
            player.src = source.url;

            // Update Active Button State
            const buttons = controlsEl.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${sourceId}`);
            if (activeBtn) activeBtn.classList.add('active');

            // Update Warning
            const warningEl = document.getElementById('drive-warning');
            if (source.warning) {
                warningEl.textContent = source.warning;
                warningEl.style.display = 'block';
            } else {
                warningEl.style.display = 'none';
            }
        }

        init();
    </script>
